<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lock It In | A Special Question</title>
  
  <!-- Meta Tags for SEO -->
  <meta name="description" content="A romantic, playful, and interactive request asking a very special question, followed by an unlocked celebratory date itinerary.">
  <meta property="og:title" content="Lock It In | A Special Question">
  <meta property="og:description" content="A romantic, playful, and interactive request asking a very special question, followed by an unlocked celebratory date itinerary.">
  <meta property="og:type" content="website">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <!-- Three.js for 3D WebGL Background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

  <!-- Looping Background Music -->
  <audio id="bg-music" src="assets/music/background.mp3" loop preload="auto" autoplay playsinline></audio>

  <!-- Floating Premium Music Controller -->
  <div class="music-control-container">
    <div id="music-card" class="music-card">
      <button id="btn-music-toggle" class="music-toggle" aria-label="Toggle background music">
        <span class="music-icon">🎵</span>
        <div class="music-waves hidden">
          <span class="stroke"></span>
          <span class="stroke"></span>
          <span class="stroke"></span>
        </div>
      </button>
      <div class="music-info">
        <span class="music-status">NOW PLAYING</span>
        <!-- Edit the song title below to match your downloaded MP3 -->
        <span class="music-title">Can't help fall in love</span>
      </div>
    </div>
  </div>

  <!-- Confetti Canvas for physics explosion overlay -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Names flying collision overlay -->
  <div id="names-overlay" class="names-overlay hidden">
    <div id="name-left" class="flying-name">Amen</div>
    <div id="heart-collision" class="collision-heart">❤️</div>
    <div id="name-right" class="flying-name">Rejoyce</div>
  </div>

  <!-- Main Interactive App Container -->
  <main class="app-container">
    <div id="main-card" class="glass-card">
      
      <!-- Primary Question State -->
      <section id="question-section" class="card-section active">
        <div class="heart-icon-wrapper">
          <svg class="heart-pulse-svg" viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heart-gradient)" stroke="none"/>
            <defs>
              <linearGradient id="heart-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4b8b" />
                <stop offset="100%" stop-color="#ff1a53" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        
        <h1 class="main-title">Will you go out with me?</h1>
        
        <div id="button-container" class="btn-group">
          <button id="btn-yes" class="pulse-glow" aria-label="Accept the proposal">Yes</button>
        </div>
      </section>

      <!-- Celebratory Success State -->
      <section id="success-section" class="card-section hidden">
        <div class="success-badge romantic-badge">
          <svg class="heart-lock-svg" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Lock Shackle Group (animates down) -->
            <g class="lock-shackle">
              <path d="M 8,9 A 4 4 0 0 1 16,9 V 11 H 8 Z" stroke="url(#lock-gold-gradient)"/>
            </g>
            <!-- Heart Padlock Body -->
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#lock-pink-gradient)" stroke="none"/>
            <!-- Keyhole detail -->
            <circle cx="12" cy="11.5" r="1.2" fill="#1f1137"/>
            <path d="M 11.6,12.5 H 12.4 L 12.7,15 H 11.3 Z" fill="#1f1137"/>
            
            <defs>
              <linearGradient id="lock-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffd700" />
                <stop offset="100%" stop-color="#ffa500" />
              </linearGradient>
              <linearGradient id="lock-pink-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4b8b" />
                <stop offset="100%" stop-color="#cc1e5d" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        
        <h2 class="success-title">Amen & Rejoyce ❤️</h2>
        <!-- <p class="success-subtitle">Here is our celebratory plan:</p> -->
        
        <!-- Interactive Itinerary Map -->
        <div id="itinerary-map" class="map-container">
          <svg id="itinerary-svg" class="map-svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" aria-label="Itinerary map"></svg>
        </div>

        <!-- Romantic Quote Footer -->
        <div class="romantic-quote-footer">
          <p class="quote-text">"Locked in a beautiful journey, together."</p>
        </div>
      </section>

    </div>
  </main>

  <!-- Core JavaScript -->
  <script src="assets/js/app.js"></script>
</body>
</html>
